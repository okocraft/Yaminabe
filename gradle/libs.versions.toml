[versions]
# libraries
adventure = "5.2.0"
annotations = "26.1.0"
configurate = "4.2.0"
mcmsgdef = "1.3.0"

# platform api
paper = "26.2.build.111-stable"

# testing tool
junit = "6.1.3"

# testing environment
mockito = "5.23.0"
slf4j = "2.0.18"

# gradle plugins
paperweight-userdev = "2.0.0-beta.21"
run-server = "3.1.0"
gradle-plugins = "1.8.5"

[libraries]

# libraries
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }
configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }
mcmsgdef = { module = "dev.siroshun.mcmsgdef:mcmsgdef", version.ref = "mcmsgdef" }

# platform api
paper = { module = "io.papermc.paper:paper-api", version.ref = "paper" }

# testing tool
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }

# testing environment
mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

[plugins]

paperweight-userdev = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight-userdev" }
run-server = { id = "xyz.jpenilla.run-paper", version.ref = "run-server" }
bundler = { id = "dev.siroshun.gradle.plugins.bundler", version.ref = "gradle-plugins" }
jcommon = { id = "dev.siroshun.gradle.plugins.jcommon", version.ref = "gradle-plugins" }
