name: Patch EssentialsX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Patch latest EssentialsX dev build
        run: python3 scripts/patch-essentialsx.py

      - name: Upload patched EssentialsX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: build/essentialsx/*-patched.jar
          if-no-files-found: error
