name: Patch EssentialsX

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Patch latest EssentialsX dev build
        run: python3 scripts/patch-essentialsx.py

      - name: Upload patched EssentialsX
        uses: actions/upload-artifact@v7
        with:
          path: build/essentialsx/*-patched.jar
          archive: false
          if-no-files-found: error
